<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Flappy Bird - Score Speed Edition</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      font-family: 'Press Start 2P', cursive;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .game-container {
      position: relative;
      width: 100%;
      max-width: 400px;
      aspect-ratio: 2 / 3;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      border: 6px solid #FF6F61;
      border-radius: 15px;
      box-shadow: 0 0 25px rgba(255, 111, 97, 0.7);
    }

    #scoreDisplay {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 8px 16px;
      font-size: 12px;
      border-radius: 8px;
      z-index: 5;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
    }

    #gameOverOverlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      color: #fff;
      font-size: 14px;
      display: none;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 10;
      text-align: center;
      animation: fadeIn 1s ease-in-out;
      padding: 20px;
    }

    #playAgainButton {
      margin-top: 20px;
      font-size: 12px;
      padding: 12px 24px;
      background: linear-gradient(135deg, #ff4081, #ff8c00);
      border: none;
      color: white;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(255, 105, 180, 0.7);
      transition: transform 0.2s ease;
    }

    #playAgainButton:hover {
      transform: scale(1.1);
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @media (max-width: 480px) {
      #scoreDisplay { font-size: 10px; padding: 6px 12px; }
      #playAgainButton { font-size: 10px; padding: 10px 20px; }
    }
  </style>
</head>
<body>
  <div class="game-container">
    <div id="scoreDisplay">Score: 0</div>
    <canvas id="gameCanvas"></canvas>
    <div id="gameOverOverlay">
      <div style="font-size: 16px; margin-bottom: 10px;">💀 GAME OVER 💀</div>
      <div>Your Score: <span id="finalScore">0</span></div>
      <button id="playAgainButton">🔁 Play Again</button>
    </div>
  </div>

  <!-- 🎵 Sound Elements -->
  <audio id="bgMusic" src="bg.wav" loop></audio>
  <audio id="flapSound" src="flap.flac"></audio>
  <audio id="hitSound" src="hit.wav"></audio>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const overlay = document.getElementById("gameOverOverlay");
    const finalScore = document.getElementById("finalScore");
    const scoreDisplay = document.getElementById("scoreDisplay");
    const playAgainBtn = document.getElementById("playAgainButton");

    const bgMusic = document.getElementById("bgMusic");
    const flapSound = document.getElementById("flapSound");
    const hitSound = document.getElementById("hitSound");

    function resizeCanvas() {
      canvas.width = canvas.clientWidth;
      canvas.height = canvas.clientHeight;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    const bgImg = new Image();
    const birdImg = new Image();
    bgImg.src = "bg.jpg";
    birdImg.src = "bird.png";

    let bird, gravity, lift, velocity, pipes, score, gameRunning;
    let bgX = 0;
    let bgSpeed = 0.5;
    let pipeSpeed = 2;

    function updateGameSpeed() {
      if (score < 14) {
        gravity = 0.1;
        pipeSpeed = 1;
      } else if (score < 20) {
        gravity = 0.15;
        pipeSpeed = 1;
      } else if (score < 35) {
        gravity = 0.6;
        pipeSpeed = 2.5;
      } else if (score < 45) {
        gravity = 0.7;
        pipeSpeed = 3;
      } else if (score < 49) {
        gravity = 0.75;
        pipeSpeed = 3.5;
      } else if (score >= 49) {
        gravity = 0;
        pipeSpeed = 0;
        gameRunning = false;
        bgMusic.pause();
        finalScore.textContent = score;
        overlay.style.display = "flex";
        return;
      }
    }

    function initGame() {
      bird = { x: 50, y: 150, width: 40, height: 40 };
      gravity = 0.4;
      lift = -3;
      velocity = 0;
      pipes = [];
      score = 0;
      bgX = 0;
      gameRunning = true;
      scoreDisplay.textContent = "Score: 0";
      bgMusic.currentTime = 0;
      bgMusic.play();
    }

    function flap() {
      if (gameRunning) {
        velocity = lift;
        flapSound.currentTime = 0;
        flapSound.play();
      }
    }

    document.addEventListener("keydown", (e) => {
      if (["j", "J", " "].includes(e.key)) flap();
    });

    canvas.addEventListener("touchstart", () => flap(), { passive: true });

    playAgainBtn.addEventListener("click", () => {
      overlay.style.display = "none";
      initGame();
      requestAnimationFrame(gameLoop);
    });

    function generatePipe() {
      const gap = 140;
      const topHeight = Math.floor(Math.random() * (canvas.height - gap - 100)) + 50;
      pipes.push({
        x: canvas.width,
        top: topHeight,
        bottom: topHeight + gap,
        width: 60,
      });
    }

    function gameLoop() {
      if (!gameRunning) return;

      updateGameSpeed();

      bgX -= bgSpeed;
      if (bgX <= -canvas.width) bgX = 0;
      ctx.drawImage(bgImg, bgX, 0, canvas.width, canvas.height);
      ctx.drawImage(bgImg, bgX + canvas.width, 0, canvas.width, canvas.height);

      velocity += gravity;
      bird.y += velocity;
      ctx.drawImage(birdImg, bird.x, bird.y, bird.width, bird.height);

      if (pipes.length === 0 || pipes[pipes.length - 1].x < canvas.width - 200) {
        generatePipe();
      }

      pipes.forEach((pipe, index) => {
        pipe.x -= pipeSpeed;

        ctx.fillStyle = "#00FFCC";
        ctx.fillRect(pipe.x, 0, pipe.width, pipe.top);
        ctx.fillRect(pipe.x, pipe.bottom, pipe.width, canvas.height - pipe.bottom);

        if (
          bird.x + bird.width > pipe.x &&
          bird.x < pipe.x + pipe.width &&
          (bird.y < pipe.top || bird.y + bird.height > pipe.bottom)
        ) {
          return gameOver();
        }

        if (pipe.x + pipe.width < 0) {
          pipes.splice(index, 1);
          score++;
          scoreDisplay.textContent = "Score: " + score;
        }
      });

      if (bird.y + bird.height > canvas.height || bird.y < 0) {
        return gameOver();
      }

      requestAnimationFrame(gameLoop);
    }

    function gameOver() {
      gameRunning = false;
      bgMusic.pause();
      hitSound.play();
      finalScore.textContent = score;
      overlay.style.display = "flex";
    }

    let assetsLoaded = 0;
    [bgImg, birdImg].forEach(img => {
      img.onload = () => {
        assetsLoaded++;
        if (assetsLoaded === 2) {
          initGame();
          requestAnimationFrame(gameLoop);
        }
      };
    });
  </script>
</body>
</html>
